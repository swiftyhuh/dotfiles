background {
    monitor =
    color = rgba(1f1c27ff)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgba(b6a0ffff)
    inner_color = rgba(1f1c27cc)
    font_color = rgba(b6a0ffff)
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked
    color = rgba(b6a0ffff)
    font_size = 22
    font_family = JetBrains Mono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(b6a0ffff)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 145
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(b6a0ffcc)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 85
    halign = center
    valign = center
}
